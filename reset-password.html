<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hope Enterprise — Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/assets/css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a href="index.html" class="brand">
          <span class="brand-serif">Hope</span>
          <span class="brand-sans">ENTERPRISE</span>
        </a>
        <nav class="topbar-nav">
          <a href="index.html" class="nav-btn-outline">Back to Sign In</a>
        </nav>
      </div>
    </header>

    <main style="max-width: 440px; margin: 4rem auto; padding: 1.5rem;">
      <section class="auth-card" style="width: 100%;">
        <div class="status-pill" style="margin-bottom: 0.75rem;">
          <span class="status-dot"></span>
          <span>ACCOUNT RECOVERY</span>
        </div>
        <h1 style="font-family: 'Instrument Serif', serif; font-size: 2rem; margin: 0 0 0.4rem;">
          Reset <em>Password.</em>
        </h1>
        <p id="reset-status" style="font-size: 0.85rem; color: #9ca3af; margin: 0 0 1.25rem;">
          Verifying your recovery link...
        </p>

        <form id="reset-password-form" novalidate>
          <div class="field-group">
            <label for="new-password">NEW PASSWORD (MIN 6 CHARS)</label>
            <input
              type="password"
              id="new-password"
              name="password"
              minlength="6"
              autocomplete="new-password"
              required
            />
          </div>

          <div class="field-group">
            <label for="confirm-password">CONFIRM NEW PASSWORD</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm_password"
              minlength="6"
              autocomplete="new-password"
              required
            />
          </div>

          <div
            id="reset-message"
            style="font-size: 0.82rem; margin-bottom: 0.75rem; min-height: 1.1rem;"
          ></div>

          <button type="submit" id="reset-submit-btn" class="btn-primary">
            Update Password
          </button>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="src/config/env.local.js"></script>
    <script type="module">
      import { supabaseClient } from './src/config/supabaseClient.js';

      const statusEl = document.getElementById('reset-status');
      const formEl = document.getElementById('reset-password-form');
      const msgEl = document.getElementById('reset-message');
      const submitBtn = document.getElementById('reset-submit-btn');

      function setMsg(text, isError = false) {
        msgEl.style.color = isError ? '#FCA5A5' : '#6EE7B7';
        msgEl.textContent = text;
      }

      if (!supabaseClient) {
        statusEl.textContent = 'Supabase client is not initialized.';
        submitBtn.disabled = true;
      } else {
        const { data } = await supabaseClient.auth.getSession();
        if (data?.session) {
          statusEl.textContent = 'Recovery session active. Enter your new password below.';
        } else {
          statusEl.textContent = 'Open the reset link sent to your email to set a new password.';
        }

        supabaseClient.auth.onAuthStateChange((event) => {
          if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
            statusEl.textContent = 'Recovery session verified. Enter your new password below.';
          }
        });

        formEl.addEventListener('submit', async (e) => {
          e.preventDefault();
          const password = document.getElementById('new-password').value;
          const confirm = document.getElementById('confirm-password').value;

          if (password.length < 6) {
            setMsg('Password must be at least 6 characters.', true);
            return;
          }
          if (password !== confirm) {
            setMsg('Passwords do not match.', true);
            return;
          }

          submitBtn.disabled = true;
          setMsg('Updating password...');

          const { error } = await supabaseClient.auth.updateUser({ password });
          submitBtn.disabled = false;

          if (error) {
            setMsg(error.message || 'Failed to update password.', true);
            return;
          }

          setMsg('Password updated! Redirecting to sign in...');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1200);
        });
      }
    </script>
  </body>
</html>
