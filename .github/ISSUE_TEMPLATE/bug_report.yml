name: Bug Report
description: Report a bug or defect found during testing
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: task_id
    attributes:
      label: Related Task ID
      placeholder: e.g., S1-DEV-03
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
    validations:
      required: true